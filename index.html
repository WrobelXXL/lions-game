<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman - Galgenmaennchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <h1>&#127919; Galgenmaennchen</h1>

        <div id="game-area">
            <div id="canvas-wrapper">
                <canvas id="hangman-canvas" width="320" height="360"></canvas>
                <div id="speech-bubble" class="hidden">Hallo! &#128075;</div>
            </div>

            <div id="info-panel">
                <div id="word-display"></div>

                <div id="wrong-section">
                    <h3>Falsche Buchstaben:</h3>
                    <div id="wrong-letters"></div>
                </div>

                <div id="round-counter">Runde: <span id="round-num">1</span></div>
            </div>
        </div>

        <div id="keyboard"></div>
    </div>

    <div id="overlay" class="hidden">
        <canvas id="confetti-canvas"></canvas>
        <div id="overlay-box">
            <h2 id="overlay-title"></h2>
            <p id="overlay-message"></p>
            <button id="overlay-btn"></button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
